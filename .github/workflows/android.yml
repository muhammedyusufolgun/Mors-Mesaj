name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['release/**']
  workflow_dispatch:
concurrency:
  group: mors-release
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Derleme durumunu kaydet
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mors dönüşümü ve zamanlama testi
        run: |
          javac -encoding UTF-8 -d /tmp/morstest app/src/main/java/tr/olgun/mors/Morse.java app/src/main/java/tr/olgun/mors/ToneDetector.java app/src/main/java/tr/olgun/mors/LightDetector.java tests/*.java
          java -cp /tmp/morstest tr.olgun.mors.MorseTest
          java -cp /tmp/morstest tr.olgun.mors.ToneTest
          java -cp /tmp/morstest tr.olgun.mors.LightTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease --console=plain
      - name: Çevrimdışı imzalama paketini hazırla
        run: |
          set -euo pipefail
          sdk=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p signing-input
          "$sdk/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk signing-input/aligned.apk
          cp "$sdk/lib/apksigner.jar" signing-input/
          gh release download signing-v1 -p mors-release.p12.cms -D signing-input
      - uses: actions/upload-artifact@v4
        with:
          name: Mors-signing-input
          path: signing-input/
      - name: Sonucu kaydet
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
