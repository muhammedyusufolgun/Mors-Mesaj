name: Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Derleme durumunu kaydet
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mors dönüşümü ve zamanlama testi
        run: |
          javac -encoding UTF-8 -d /tmp/morstest app/src/main/java/tr/olgun/mors/Morse.java tests/MorseTest.java
          java -cp /tmp/morstest tr.olgun.mors.MorseTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --console=plain
      - run: cp app/build/outputs/apk/debug/app-debug.apk Mors-Mesaj.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mors-Mesaj
          path: Mors-Mesaj.apk
      - name: APK indirme bağlantısını oluştur
        run: gh release create "apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" Mors-Mesaj.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mors Mesaj 1.0" --notes "Android 6 ve üzeri için Mors Mesaj APK."
      - name: Sonucu kaydet
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
