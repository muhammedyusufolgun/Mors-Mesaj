name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: mors-release
  cancel-in-progress: false
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Derleme durumunu kaydet
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Mors dönüşümü ve zamanlama testi
        run: |
          javac -encoding UTF-8 -d /tmp/morstest app/src/main/java/tr/olgun/mors/Morse.java app/src/main/java/tr/olgun/mors/ToneDetector.java tests/*.java
          java -cp /tmp/morstest tr.olgun.mors.MorseTest
          java -cp /tmp/morstest tr.olgun.mors.ToneTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleRelease --console=plain
      - name: Yayın anahtarıyla imzala ve doğrula
        env:
          RECOVERY_PEM: ${{ secrets.MORS_RECOVERY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/mors.p12"
          backup="mors-release.p12.cms"
          # The recovery certificate is public. Only the owner has its private key.
          if gh release view signing-v1 --json tagName >/dev/null 2>&1; then
            test -n "$RECOVERY_PEM" || { echo "MORS_RECOVERY_PEM is required to reuse the existing signing identity"; exit 1; }
            gh release download signing-v1 -p "$backup"
            printf '%s\n' "$RECOVERY_PEM" > "$RUNNER_TEMP/recovery.pem"
            openssl cms -decrypt -binary -inform DER -in "$backup" -recip signing/recovery.crt -inkey "$RUNNER_TEMP/recovery.pem" -out "$key"
          else
            keytool -genkeypair -storetype PKCS12 -keystore "$key" -storepass encrypted-envelope -keypass encrypted-envelope -alias mors -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Mors Mesaj"
            openssl cms -encrypt -binary -aes256 -in "$key" -outform DER -out "$backup" signing/recovery.crt
            gh release create signing-v1 "$backup" --target "$GITHUB_SHA" --title "Şifreli imza yedeği" --notes "Yayın anahtarının şifreli kurtarma kopyası." --prerelease --latest=false
          fi
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias mors --ks-pass pass:encrypted-envelope --out Mors-Mesaj.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs Mors-Mesaj.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mors-Mesaj
          path: Mors-Mesaj.apk
      - name: APK indirme bağlantısını oluştur
        run: gh release create "apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" Mors-Mesaj.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Mors Mesaj 1.1" --notes "Işık ve ses ile Mors, yerel mesaj kayıtları, iki aşamalı silme ve metin yapıştırma."
      - name: Sonucu kaydet
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=android/apk -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
